<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lève-toi, brille</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lève-toi">
<meta name="theme-color" content="#130709">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Hanken+Grotesk:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap">
<style>
/* Lève-toi, brille · même univers que Ma vie et Mon Coach : velours bordeaux, satin noir, notes en soie ivoire avec un morceau de scotch. Le rose reste un détail. Sombre ou clair selon l'appareil. */
:root{
  color-scheme:dark;
  --bg:#130709; --surface:#220F14; --raised:#3A1820; --noir:#0B0708;
  --cream:#F5EFE9; --muted:#BCA8A7; --line:#45202A;
  --paper:#F3EEE8; --paper-ink:#2A1A1D; --paper-soft:#8A7470; --paper-line:#E2D6CE;
  --rose:#E4B6BE; --rose-ink:#9C4459; --bordeaux:#6E1A28; --gold:#EE9DBB;
  --f-display:"Bodoni Moda","Bodoni 72",Didot,Georgia,serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  --panel:rgba(34,15,20,.72); --now:rgba(238,157,187,.13);
  --app-bg:radial-gradient(820px 520px at 80% -6%,rgba(238,157,187,.13),transparent 62%),radial-gradient(900px 700px at 30% 30%,rgba(110,26,40,.55),transparent 70%),radial-gradient(800px 700px at 90% 100%,rgba(90,18,30,.6),transparent 65%),var(--bg);
  --paper-grad:linear-gradient(155deg,#FCFAF7 0%,#EFE8E0 38%,#F8F4EF 58%,#E8DFD6 100%);
  --shadow-note:0 22px 40px -22px rgba(0,0,0,.85),0 2px 0 rgba(0,0,0,.3);
  --ivory:#F5EFE9; --ivory-soft:#BCA8A7; --gold-fixed:#EE9DBB;
  --satin:linear-gradient(125deg,#0B0708 0%,#1C1517 34%,#0B0708 52%,#231B1D 70%,#0B0708 100%);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F5F0EB; --surface:#FFFFFF; --raised:#E8DCD6;
  --cream:#2A1A1D; --muted:#7D6967; --line:#E4D7D0;
  --paper:#FFFFFF; --paper-line:#ECE3DD;
  --rose:#A8506A; --gold:#B4466F;
  --panel:rgba(255,255,255,.74); --now:rgba(180,70,111,.10);
  --app-bg:radial-gradient(760px 540px at 55% 18%,rgba(214,180,176,.55),transparent 70%),radial-gradient(700px 500px at 100% 0%,rgba(238,157,187,.22),transparent 60%),var(--bg);
  --paper-grad:linear-gradient(155deg,#FFFFFF 0%,#F8F4F0 40%,#FFFFFF 62%,#F3EDE8 100%);
  --shadow-note:0 18px 34px -20px rgba(70,30,40,.35),0 1px 0 rgba(70,30,40,.08);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F5F0EB; --surface:#FFFFFF; --raised:#E8DCD6;
  --cream:#2A1A1D; --muted:#7D6967; --line:#E4D7D0;
  --paper:#FFFFFF; --paper-line:#ECE3DD;
  --rose:#A8506A; --gold:#B4466F;
  --panel:rgba(255,255,255,.74); --now:rgba(180,70,111,.10);
  --app-bg:radial-gradient(760px 540px at 55% 18%,rgba(214,180,176,.55),transparent 70%),radial-gradient(700px 500px at 100% 0%,rgba(238,157,187,.22),transparent 60%),var(--bg);
  --paper-grad:linear-gradient(155deg,#FFFFFF 0%,#F8F4F0 40%,#FFFFFF 62%,#F3EDE8 100%);
  --shadow-note:0 18px 34px -20px rgba(70,30,40,.35),0 1px 0 rgba(70,30,40,.08);
  color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--cream);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
a{color:inherit}

.app{min-height:100vh;background:var(--app-bg);padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(120px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:22px}
.brand{font-family:var(--f-display);font-size:22px;letter-spacing:.01em}
.brand em{color:var(--gold)}
.toplink{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;color:var(--muted)}
.view{display:flex;flex-direction:column;gap:24px}
.head{display:flex;flex-direction:column;gap:2px}
.kicker{font-family:var(--f-hand);font-size:26px;line-height:1.1;color:var(--gold)}
.h-page{font-family:var(--f-display);font-size:clamp(36px,10vw,50px);line-height:1;letter-spacing:-.01em}
.h-sec{font-family:var(--f-display);font-style:italic;font-size:24px;line-height:1.1}
.spaced{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.38em;font-size:12px;color:var(--gold)}
.soft{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}

/* Trois matières */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.paper{position:relative;background:var(--paper);background-image:var(--paper-grad);color:var(--paper-ink);border-radius:3px;padding:26px 20px 18px;min-width:0;box-shadow:var(--shadow-note)}
.paper .soft,.paper .when,.paper .count{color:var(--paper-soft)}
.tape::before{content:"";position:absolute;top:-11px;left:50%;width:92px;height:24px;transform:translateX(-50%) rotate(-3deg);background:rgba(20,10,12,.55);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.noir{background:var(--noir);background-image:var(--satin);border:1px solid #2A1D20;border-radius:4px;padding:26px 22px;color:var(--ivory);text-align:center;box-shadow:var(--shadow-note)}
.noir .spaced{color:var(--gold-fixed)}
.noir .soft{color:var(--ivory-soft)}
.verse{font-family:var(--f-display);font-style:italic;font-size:21px;line-height:1.35}

.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.count{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.plab{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--muted);text-transform:uppercase;margin:12px 0 2px}
.paper .plab{color:var(--paper-soft)}
.empty{color:var(--muted);font-style:italic;font-size:15px;padding:6px 0}
.paper .empty{color:var(--paper-soft)}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--cream);background:var(--cream);color:var(--bg);border-radius:999px;padding:9px 18px;font-size:15px;font-weight:600}
.btn.line{background:transparent;color:var(--cream)}
.btn.sm{padding:6px 13px;font-size:13.5px}
.btn.danger{background:transparent;color:var(--gold);border-color:var(--gold)}
.noir .btn{border-color:var(--ivory);background:var(--ivory);color:#130709}
.noir .btn.line{background:transparent;color:var(--ivory)}
.paper .btn{border-color:var(--paper-ink);background:var(--paper-ink);color:var(--paper)}
.paper .btn.line{background:transparent;color:var(--paper-ink)}
.add{border:1px dashed var(--muted);background:none;color:var(--cream);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
.paper .add{border-color:var(--paper-soft);color:var(--paper-ink)}
.more{border:0;background:none;color:var(--muted);font-size:17px;line-height:1;padding:8px 6px;border-radius:8px;flex:none}
.paper .more{color:var(--paper-soft)}
.read{font-size:13.5px;font-weight:700;color:var(--gold);text-decoration:underline;text-underline-offset:3px;white-space:nowrap;padding:10px 4px;flex:none}
.paper .read{color:var(--rose-ink)}
.link{background:none;border:0;padding:0;font-size:14px;font-weight:600;color:var(--gold);text-decoration:underline;text-underline-offset:3px}
.paper .link{color:var(--rose-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--cream);border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--cream);color:var(--bg);border-color:var(--cream)}
.chip small{opacity:.7;margin-left:4px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.s4{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg button{border:0;background:none;border-radius:999px;padding:8px 2px;font-weight:600;font-size:13.5px;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--cream);color:var(--bg)}
.scroll-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.scroll-chips::-webkit-scrollbar{display:none}
.scroll-chips .chip{flex:none;white-space:nowrap}

/* Listes à cocher */
.items li{display:flex;align-items:flex-start;gap:2px;border-bottom:1px dashed var(--line)}
.paper .items li{border-bottom-color:var(--paper-line)}
.items li:last-child{border-bottom:0}
.check{display:flex;align-items:flex-start;gap:12px;flex:1;min-width:0;text-align:left;background:none;border:0;padding:9px 0}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--muted);display:grid;place-items:center;margin-top:1px;transition:background .15s,border-color .15s}
.box svg{width:15px;height:15px;opacity:0;color:var(--bg)}
.paper .box{border-color:var(--paper-soft)}
.paper .box svg{color:var(--paper)}
.check[aria-pressed="true"] .box{background:var(--rose);border-color:var(--rose)}
.paper .check[aria-pressed="true"] .box{background:var(--rose-ink);border-color:var(--rose-ink)}
.check[aria-pressed="true"] .box svg{opacity:1}
.lbl{min-width:0;overflow-wrap:anywhere}
.lbl .tt{display:block}
.check[aria-pressed="true"] .tt{opacity:.6;text-decoration:line-through;text-decoration-color:var(--rose)}
.paper .check[aria-pressed="true"] .tt{text-decoration-color:var(--rose-ink)}
.when{display:block;font-size:13px;color:var(--muted)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-right:6px}
.paper .tag{color:var(--rose-ink)}
.rows li{display:flex;align-items:flex-start;gap:8px;border-bottom:1px dashed var(--line);padding:2px 0}
.paper .rows li{border-bottom-color:var(--paper-line)}
.rows li:last-child{border-bottom:0}
.rowbtn{all:unset;cursor:pointer;flex:1;min-width:0;padding:9px 0;overflow-wrap:anywhere}
.rowbtn b{display:block;font-weight:600}
.rowbtn:focus-visible{outline:2px solid var(--gold);border-radius:6px}

/* Ma semaine en un coup d'œil */
.wkdots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wkd{display:flex;flex-direction:column;align-items:center;gap:5px}
.wkd .l{font-size:12px;color:var(--muted);font-weight:600}
.dot2{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:600;background:var(--line);color:var(--muted);border:2px solid transparent}
.dot2.part{background:transparent;border-color:var(--rose);color:var(--cream)}
.dot2.full{background:var(--rose);color:var(--bg)}
.dot2.is-now{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--gold)}
.pbar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.paper .pbar{background:var(--paper-line)}
.pbar i{display:block;height:100%;background:var(--rose);border-radius:6px}
.paper .pbar i{background:var(--rose-ink)}
.noir .pbar{background:rgba(245,239,233,.16)}
.noir .pbar i{background:var(--gold-fixed)}
.prog li{padding:10px 0;border-bottom:1px dashed var(--line)}
.prog li:last-child{border-bottom:0}
.prog .pn{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-display);font-size:18px}
.prog .pn span{font-family:var(--f-body);font-size:13px;color:var(--gold);white-space:nowrap}
.prog .px{font-size:13.5px;color:var(--muted)}

/* Planning façon Mon service */
.plan-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.plan-nav .wk{text-align:center;flex:1;min-width:0}
.plan-nav .wk b{font-family:var(--f-display);font-size:19px;font-weight:400}
.plan-nav .wk small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;font-size:18px}
.pcards{display:flex;flex-direction:column;gap:12px}
.pcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid transparent;border-radius:16px;padding:10px 14px 6px}
.pcard.is-now{border-left-color:var(--gold)}
.pcard .dh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard .dh b{font-family:var(--f-display);font-size:20px;font-weight:400}
.now-tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--gold);color:var(--bg)}
.dh-add{background:none;border:0;color:var(--muted);font-size:22px;line-height:1;padding:4px 6px}
.pstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pstat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.pstat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:400}
.pstat span{font-size:13px;color:var(--muted)}
.pweek{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.pweek h3{font-family:var(--f-display);font-weight:400;font-size:19px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pweek h3 small{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.pd{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:8px;text-transform:capitalize}
.band{border:1px dashed var(--line);border-radius:14px;padding:8px 12px 4px}
details.fold{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:14px 18px}
details.fold>summary{cursor:pointer;list-style:none;font-family:var(--f-display);font-style:italic;font-size:21px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-style:normal;font-family:var(--f-body);color:var(--gold);font-size:22px}
details.fold[open]>summary::after{content:"−"}
details.fold[open]>summary{margin-bottom:10px}

/* Prières */
.theme-card .th{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.theme-card h3{font-family:var(--f-display);font-size:21px;line-height:1.15}
.theme-card .day{font-size:12.5px;color:var(--gold);font-weight:600}
.big-theme{font-family:var(--f-display);font-size:34px;line-height:1.05;margin:8px 0 6px}
.stamp{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1.5px solid var(--gold);border-radius:4px;padding:1px 6px}
.paper .stamp{color:var(--rose-ink);border-color:var(--rose-ink)}
.mini-t{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:none;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;margin-top:7px;flex:none}
.mini-t[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:var(--bg)}
.paper .mini-t{border-color:var(--paper-line);color:var(--paper-soft)}
.paper .mini-t[aria-pressed="true"]{background:var(--rose-ink);border-color:var(--rose-ink);color:var(--paper)}

/* Navigation en bas, en satin noir */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--noir);background-image:var(--satin);border-top:1px solid #2A1D20;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.nav button{background:none;border:0;color:var(--ivory-soft);font-size:12.5px;font-weight:600;padding:8px 2px 6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:5px}
.nav button::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.35}
.nav button[aria-selected="true"]{color:var(--ivory);background:rgba(238,157,187,.12)}
.nav button[aria-selected="true"]::before{background:var(--gold-fixed);opacity:1}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--gold);color:var(--bg);font-size:32px;line-height:1;box-shadow:0 10px 24px rgba(0,0,0,.35);z-index:25}

/* Petite fenêtre */
.sheet-bg{position:fixed;inset:0;background:rgba(8,4,5,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;background:var(--surface);color:var(--cream);border:1px solid var(--line);border-bottom:0;border-top:3px solid var(--gold);border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow-y:auto}
.sheet h2{font-family:var(--f-display);font-style:italic;font-size:26px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 13px;font-size:16px;color:var(--cream)}
.field textarea{min-height:110px;line-height:1.45;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.msg{font-size:14px;color:var(--gold);min-height:1em}
.choice{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.choice b{font-family:var(--f-display);font-size:19px;font-weight:400}
.choice span{font-size:13.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--cream);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:90vw;text-align:center}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;background:var(--panel);padding:10px 12px;font-size:14px}
.banner span{flex:1;min-width:0}
.note-old p{font-size:14px;margin-top:4px;white-space:pre-wrap}
.note-old b{font-weight:600}
@media (max-width:370px){.dot2{width:30px;height:30px;font-size:11.5px}.nav button{font-size:11px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app"><div class="wrap">
  <header class="top"><div class="brand">Lève-toi, <em>brille</em></div><button class="toplink" data-v="plus">Réglages</button></header>
  <main>
    <section id="v-jour" class="view"></section>
    <section id="v-plan" class="view" hidden></section>
    <section id="v-pri" class="view" hidden></section>
    <section id="v-ens" class="view" hidden></section>
    <section id="v-plus" class="view" hidden></section>
  </main>
</div></div>
<nav class="nav" aria-label="Onglets"><div class="nav-in" role="tablist">
  <button role="tab" data-v="jour" aria-selected="true">Aujourd'hui</button>
  <button role="tab" data-v="plan" aria-selected="false">Planning</button>
  <button role="tab" data-v="pri" aria-selected="false">Prières</button>

<script>
/* =========================================================

const KEY = 'levetoi:v1';
const THEMES0 = ['Ma vie personnelle', 'Famille', 'Amis', 'Église et intercession', 'Travail et projets'];

const EMPTY = () => ({ v: 4, days: {}, med: {}, sujets: [], themes: THEMES0.slice(), thKind: {}, notes: [], plan: [], series: [],
  ens: [], ensThemes: ENS0.slice(), ensCur: null, ensAss: {}, tp: TP0(), prenom: '',
  dept: [], taches: [], personnes: [], jn: {}, meds: null, medCur: null, bibleUrl: '', lastBackup: null });

/* Anciennes méditations : seulement pour relire une très ancienne sauvegarde qui n'avait pas encore « meds ». */
const FEMMES = [['Léa, la mal-aimée', 'Genèse 29:16-35'], ['Rachel, aimée mais insatisfaite', 'Genèse 30:1-24'], ['Agar, le Dieu qui me voit', 'Genèse 16:1-16'], ['Agar, au bout du désespoir', 'Genèse 21:8-21'], ['Anne, la détresse', '1 Samuel 1:1-18'], ['Anne, la transmission', '1 Samuel 1:19 – 2:11'], ['Relecture de la semaine', ''], ["Naomi, l'amertume", 'Ruth 1'], ['Ruth et Naomi, reconstruire', 'Ruth 2 à 4'], ['Tamar, fille de David', '2 Samuel 13:1-22'], ['Abigaïl, la sagesse dans le conflit', '1 Samuel 25'], ['La femme malade depuis douze ans', 'Marc 5:25-34'], ['La Samaritaine', 'Jean 4:1-42'], ['Relecture des deux semaines', '']];

let S = EMPTY(), storageOk = true;
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(EMPTY(), JSON.parse(raw)); } catch (e) { storageOk = false; }

/* Migrations : rien ne se perd. Les anciens champs (med, meds, jn, dept, taches, personnes, notes) restent dans l'objet et dans la sauvegarde. */
function migrate() {
  if (!Array.isArray(S.meds)) { const old = Object.keys(S.med || {}).some(k => /^\d+$/.test(k));
    S.meds = old ? [{ id: 'femmes', titre: 'Femmes de la Bible', start: '', jours: FEMMES.map((x, i) => ({ k: String(i + 1), nom: x[0], ref: x[1] })) }] : []; }
  if (!Array.isArray(S.themes) || !S.themes.length) S.themes = THEMES0.slice();

  if (!S.v4) { S.themes.forEach(t => { if (!S.thKind[t]) S.thKind[t] = /intercession/i.test(t) ? 'inter' : 'perso'; }); S.v4 = true; }
  ['sujets', 'notes', 'plan', 'series', 'ens', 'dept', 'taches', 'personnes'].forEach(x => { if (!Array.isArray(S[x])) S[x] = []; });
  if (!Array.isArray(S.ensThemes) || !S.ensThemes.length) S.ensThemes = ENS0.slice();

migrate();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; } catch (e) { storageOk = false; toast('Pas enregistré : la mémoire du navigateur est bloquée'); } }
save();

/* ---------- Outils ---------- */
const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fromIso = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const fmt = k => { const d = fromIso(k); return d.getDate() + ' ' + MOIS[d.getMonth()]; };
const fmtDay = k => { const d = fromIso(k); return JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()]; };
const addDays = (k, n) => { const d = fromIso(k); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((fromIso(b) - fromIso(a)) / 86400000);
const mondayOf = k => { const d = fromIso(k); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => iso(new Date());
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const dayRec = k => S.days[k] || (S.days[k] = {});
const fmtH = v => { if (!v) return ''; const [a, b] = v.split(':'); return (+a) + 'h' + (b === '00' ? '' : b); };
const toInput = h => { const m = /^(\d{1,2})h(\d{2})?$/.exec(h || ''); return m ? pad(m[1]) + ':' + (m[2] || '00') : ''; };
const plural = (n, w) => n + ' ' + w + (n > 1 ? 's' : '');
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.tm); toast.tm = setTimeout(() => { t.hidden = true; }, 2000); }
let armed = null;
function arm(id, b, txt) { if (armed === id) { armed = null; return true; } armed = id; if (b && txt !== false) b.textContent = txt || 'Touche encore pour supprimer'; else toast('Touche encore pour confirmer'); setTimeout(() => { if (armed === id) armed = null; }, 3500); return false; }

/* ---------- Lire dans ma Bible ---------- */
const BOOKS = { genese: 'GEN', exode: 'EXO', levitique: 'LEV', nombres: 'NUM', deuteronome: 'DEU', josue: 'JOS', juges: 'JDG', ruth: 'RUT', '1samuel': '1SA', '2samuel': '2SA', '1rois': '1KI', '2rois': '2KI', '1chroniques': '1CH', '2chroniques': '2CH', esdras: 'EZR', nehemie: 'NEH', esther: 'EST', job: 'JOB', psaume: 'PSA', psaumes: 'PSA', ps: 'PSA', proverbes: 'PRO', ecclesiaste: 'ECC', cantique: 'SNG', cantiquedescantiques: 'SNG', esaie: 'ISA', isaie: 'ISA', jeremie: 'JER', lamentations: 'LAM', ezechiel: 'EZK', daniel: 'DAN', osee: 'HOS', joel: 'JOL', amos: 'AMO', abdias: 'OBA', jonas: 'JON', michee: 'MIC', nahum: 'NAM', habacuc: 'HAB', sophonie: 'ZEP', aggee: 'HAG', zacharie: 'ZEC', malachie: 'MAL', matthieu: 'MAT', marc: 'MRK', luc: 'LUK', jean: 'JHN', actes: 'ACT', romains: 'ROM', '1corinthiens': '1CO', '2corinthiens': '2CO', galates: 'GAL', ephesiens: 'EPH', philippiens: 'PHP', colossiens: 'COL', '1thessaloniciens': '1TH', '2thessaloniciens': '2TH', '1timothee': '1TI', '2timothee': '2TI', tite: 'TIT', philemon: 'PHM', hebreux: 'HEB', jacques: 'JAS', '1pierre': '1PE', '2pierre': '2PE', '1jean': '1JN', '2jean': '2JN', '3jean': '3JN', jude: 'JUD', apocalypse: 'REV' };
function parseRef(txt) {
  const m = /^\s*([123])?\s*([A-Za-zÀ-ÿ' ]+?)\.?\s+(\d+)(?:\s*[:.,]\s*(\d+))?/.exec(txt || '');
  if (!m) return null;
  const key = (m[1] || '') + m[2].normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z]/g, '');
  const code = BOOKS[key]; return code ? { code, ch: +m[3], v: m[4] ? +m[4] : 0 } : null;
}
const MY_BIBLE = 'https://worldofruth.github.io/Bible-/';
function bibleHref(txt) { const r = parseRef(txt); if (!r) return ''; const mine = (S.bibleUrl || '').trim() || MY_BIBLE; return mine.replace(/#.*$/, '') + '#' + r.code + '-' + r.ch + (r.v ? '-' + r.v : ''); }
function readLink(txt) { const h = bibleHref(String(txt || '').split(' · ')[0]); return h ? `<a class="read" href="${esc(h)}" target="_blank" rel="noopener">Lire</a>` : ''; }
const normUrl = u => { u = (u || '').trim(); return u && !/^https?:\/\//i.test(u) ? 'https://' + u : u; };
const watchLink = u => u ? `<a class="read" href="${esc(normUrl(u))}" target="_blank" rel="noopener">Regarder</a>` : '';

/* ---------- Plans prêts à l'emploi (modèles, sans rien de personnel) ---------- */
const EPITRES = [['Romains', 16], ['1 Corinthiens', 16], ['2 Corinthiens', 13], ['Galates', 6], ['Éphésiens', 6], ['Philippiens', 4], ['Colossiens', 4], ['1 Thessaloniciens', 5], ['2 Thessaloniciens', 3], ['1 Timothée', 6], ['2 Timothée', 4], ['Tite', 3], ['Philémon', 1], ['Hébreux', 13], ['Jacques', 5], ['1 Pierre', 5], ['2 Pierre', 3], ['1 Jean', 5], ['2 Jean', 1], ['3 Jean', 1]];
const PALIERS = { jeune: ['demi-journée', "jusqu'à 15h", "jusqu'à 18h"], veillee: ["jusqu'à 1h", "jusqu'à 2h", "jusqu'à 3h"] };
function chapterLabel(list) { // [['Romains',16],['1 Corinthiens',1],['1 Corinthiens',2]] → « Romains 16 · 1 Corinthiens 1-2 »
  const parts = []; list.forEach(([b, c]) => { const l = parts[parts.length - 1]; if (l && l.b === b && l.to === c - 1) l.to = c; else parts.push({ b, from: c, to: c }); });
  return parts.map(p => p.b + ' ' + p.from + (p.to > p.from ? '-' + p.to : '')).join(' · ');
}
function splitChapters(books, du, au) {
  const all = []; books.forEach(([b, n]) => { for (let c = 1; c <= n; c++) all.push([b, c]); });
  const n = daysBetween(du, au) + 1; if (n < 1) return [];
  const out = []; for (let i = 0; i < n; i++) { const a = Math.floor(i * all.length / n), z = Math.floor((i + 1) * all.length / n); if (z > a) out.push({ date: addDays(du, i), t: chapterLabel(all.slice(a, z)), n: z - a }); }
  return out;
}

/* ---------- Ce qui est prévu un jour ---------- */
const TYPES = { priere: 'Prière', lecture: 'Lecture', jeune: 'Jeûne', veillee: 'Veillée', enseignement: 'Enseignement', livre: 'Livre', eglise: 'Église' };
const FILTERS = [['tout', 'Tout'], ['priere', 'Prière'], ['lecture', 'Lecture'], ['jeune', 'Jeûne'], ['veillee', 'Veillée'], ['enseignement', 'Enseignements'], ['livre', 'Livres']];
function themeOfDay(d) { const w = (d || new Date()).getDay(); if (w === 0 || !S.themes.length) return null; return S.themes[(w - 1) % S.themes.length]; }
function weekdaysOf(t) { const i = S.themes.indexOf(t), out = []; if (i < 0) return out; for (let w = 1; w <= 6; w++) if ((w - 1) % S.themes.length === i) out.push(JOURS[w]); return out; }
const openOf = t => S.sujets.filter(x => !x.answered && x.theme === t);
const seriesOf = id => S.series.find(s => s.id === id);
const pDoneKey = (p, k) => p.type === 'livre' ? 'fin' : k;
function planItem(p, k) {
  const sr = p.planId ? seriesOf(p.planId) : null, multi = p.end && p.end !== p.date;
  const lab = TYPES[p.type] || '', low = String(p.t).toLowerCase();
  const sub = [low.startsWith(lab.toLowerCase()) ? '' : lab, sr && !String(p.t).startsWith(sr.titre) ? sr.titre : '', p.note || '', multi ? (p.type === 'livre' ? 'à finir pour le ' + fmt(p.end) : 'du ' + fmt(p.date) + ' au ' + fmt(p.end)) : ''].filter(Boolean).join(' · ');
  return { kind: 'p', id: p.id, type: p.type, time: p.time || '', t: p.t, sub, done: !!(p.done && p.done[pDoneKey(p, k)]), read: p.type === 'lecture' ? p.t : '' };
}
const ensItem = e => ({ kind: 'e', id: e.id, type: 'enseignement', time: '', t: e.t, sub: 'Enseignement · ' + e.theme, done: !!e.ecoute, url: e.url });
/* opts.daily : inclure les temps de prière et les sujets du jour · opts.from : début de la période affichée (les choses sur plusieurs jours n'apparaissent qu'une fois) */
function itemsOn(k, opts) {
  opts = opts || { daily: true }; const out = [], r = S.days[k] || {};
  if (opts.daily) {
    S.tp.forEach(p => out.push({ kind: 'tp', id: p.id, type: 'priere', time: p.h || '', t: p.t, sub: '', done: !!r[p.id] }));
    if (S.themes.length) { const th = themeOfDay(fromIso(k)); out.push({ kind: 'suj', id: 'suj', type: 'priere', time: '', t: th ? 'Mes sujets du jour · ' + th : 'Dimanche · je rends grâce', sub: th ? plural(openOf(th).length, 'sujet') : 'Relire ce que Dieu a fait', done: !!r.suj }); }
  }
  S.plan.forEach(p => { const end = p.end || p.date; if (p.date > k || end < k) return;
    if (opts.from && p.date !== k && !(k === opts.from && p.date < opts.from)) return;
    out.push(planItem(p, k)); });
  S.ens.filter(e => e.date === k).forEach(e => out.push(ensItem(e)));
  const key = it => it.time ? (toInput(it.time) || '12:00') : '12:00';
  return out.map((x, i) => [x, i]).sort((a, b) => key(a[0]).localeCompare(key(b[0])) || a[1] - b[1]).map(x => x[0]);
}
const weekEns = k => S.ens.filter(e => e.week && e.week === mondayOf(k));
const matchF = (it, f) => f === 'tout' || it.type === f;
function rowHTML(it, k) {
  const when = [it.time, it.sub].filter(Boolean).map(esc).join(' · ');
  return `<li><button class="check" data-tg="${it.kind}|${esc(it.id)}|${k}" aria-pressed="${it.done ? 'true' : 'false'}"><span class="box">${CHECK}</span><span class="lbl"><span class="tt">${esc(it.t)}</span>${when ? `<span class="when">${when}</span>` : ''}</span></button>${it.read ? readLink(it.read) : ''}${it.url ? watchLink(it.url) : ''}<button class="more" data-ed="${it.kind}|${esc(it.id)}" aria-label="Modifier">✎</button></li>`;
}
function dayScore(k) { const it = itemsOn(k); return { n: it.length, d: it.filter(x => x.done).length }; }

/* ---------- Aujourd'hui ---------- */
function renderJour() {
  const now = new Date(), k = today(), hr = now.getHours();
  const items = itemsOn(k), nd = items.filter(i => i.done).length, wk = weekEns(k);
  const hello = (hr >= 18 || hr < 4 ? 'Bonsoir' : 'Bonjour') + (S.prenom ? ' ' + S.prenom : '');
  let h = `<div class="head"><div class="kicker">${esc(hello)}</div><h1 class="h-page">${cap(JOURS[now.getDay()])} ${now.getDate()} ${MOIS[now.getMonth()]}</h1></div>`;
  h += `<div class="noir"><p class="verse">« Lève-toi, sois éclairée, car ta lumière arrive, et la gloire de l'Éternel se lève sur toi. »</p><div class="spaced" style="margin-top:14px">Ésaïe 60:1</div></div>`;
  h += `<div class="paper tape"><div class="card-head"><h2 class="h-sec">Ma journée avec Dieu</h2><span class="count">${nd} sur ${items.length}</span></div><ul class="items">${items.map(i => rowHTML(i, k)).join('')}</ul>`;
  if (wk.length) h += `<div class="plab">À écouter cette semaine</div><ul class="items">${wk.map(e => rowHTML(ensItem(e), k)).join('')}</ul>`;
  h += `</div>`;
  // Ma semaine en un coup d'œil
  const mon = mondayOf(k); let tn = 0, td = 0, dots = '';
  for (let i = 0; i < 7; i++) { const dk = addDays(mon, i), sc = dayScore(dk), d = fromIso(dk); tn += sc.n; td += sc.d;
    const cls = sc.n && sc.d === sc.n ? 'full' : sc.d ? 'part' : '';
    dots += `<div class="wkd"><span class="l">${JOURS[d.getDay()].slice(0, 1).toUpperCase()}</span><span class="dot2 ${cls}${dk === k ? ' is-now' : ''}">${d.getDate()}</span></div>`; }
  h += `<div class="panel"><div class="card-head"><h2 class="h-sec">Ma semaine</h2><span class="count">${td} fait${td > 1 ? 's' : ''} sur ${tn}</span></div><div class="wkdots">${dots}</div><div class="pbar"><i style="width:${tn ? Math.round(td / tn * 100) : 0}%"></i></div></div>`;
  // Mes plans en cours
  const prog = S.series.map(s => { const es = S.plan.filter(p => p.planId === s.id).sort((a, b) => a.date.localeCompare(b.date)); if (!es.length || es[es.length - 1].date < k) return '';
    const done = es.filter(p => p.done && p.done[p.date]).length, nx = es.find(p => p.date >= k);
    const nxt = nx ? (nx.date === k ? "Aujourd'hui : " : cap(fmtDay(nx.date)) + ' : ') + nx.t : '';
    return `<li><button class="rowbtn" data-v="plan"><span class="pn">${esc(s.titre)}<span>${done} sur ${es.length}</span></span><div class="pbar"><i style="width:${Math.round(done / es.length * 100)}%"></i></div><span class="px">${esc(nxt)}</span></button></li>`; }).join('');
  if (prog) h += `<div class="panel"><h2 class="h-sec" style="margin-bottom:4px">Mes plans en cours</h2><ul class="prog">${prog}</ul></div>`;
  // Thème d'enseignement du moment

  const has = S.sujets.length || S.plan.length || S.ens.length;
  if (has && (!S.lastBackup || daysBetween(S.lastBackup, k) >= 30)) h += `<div class="banner"><span>${S.lastBackup ? 'Ta dernière sauvegarde date du ' + fmt(S.lastBackup) + '.' : "Tu n'as pas encore gardé de copie."}</span><button class="link" data-v="plus">Sauvegarder</button></div>`;
  document.getElementById('v-jour').innerHTML = h;
}

/* ---------- Planning ---------- */
const folds = {};
let pView = 'sem', weekOff = 0, monthOff = 0, pF = 'tout';
function renderPlan() {
  const k = today();
  let h = `<div class="head"><div class="kicker">Planning</div><h1 class="h-page">Ma vie spirituelle</h1></div>`;
  h += `<div class="seg"><button data-pv="sem" aria-pressed="${pView === 'sem'}">Semaine</button><button data-pv="mois" aria-pressed="${pView === 'mois'}">Mois</button></div>`;
  h += `<div class="scroll-chips">${FILTERS.map(([v, l]) => `<button class="chip" data-f="${v}" aria-pressed="${pF === v}">${l}</button>`).join('')}</div>`;
  const ensOk = pF === 'tout' || pF === 'enseignement';
  if (pView === 'sem') {
    const mon = addDays(mondayOf(k), weekOff * 7), sun = addDays(mon, 6);
    const days = []; let n = 0, d = 0;
    for (let i = 0; i < 7; i++) { const dk = addDays(mon, i), it = itemsOn(dk, { daily: true, from: mon }).filter(x => matchF(x, pF)); n += it.length; d += it.filter(x => x.done).length; days.push([dk, it]); }
    const we = ensOk ? S.ens.filter(e => e.week === mon) : [];
    h += `<div class="plan-nav"><button class="icon-btn" data-wk="-1" aria-label="Semaine précédente">‹</button><div class="wk"><b>${weekOff === 0 ? 'Cette semaine' : 'Du ' + fmt(mon) + ' au ' + fmt(sun)}</b><small>${d} fait${d > 1 ? 's' : ''} sur ${n}</small><div class="pbar"><i style="width:${n ? Math.round(d / n * 100) : 0}%"></i></div></div><button class="icon-btn" data-wk="1" aria-label="Semaine suivante">›</button></div>`;
    if (we.length) h += `<div class="band"><div class="plab" style="margin-top:2px">À écouter cette semaine</div><ul class="items">${we.map(e => rowHTML(ensItem(e), mon)).join('')}</ul></div>`;
    h += `<div class="pcards">${days.map(([dk, it]) => `<div class="pcard${dk === k ? ' is-now' : ''}"><div class="dh"><b>${cap(fmtDay(dk))}</b><span class="row" style="gap:4px">${dk === k ? '<span class="now-tag">AUJOURD\'HUI</span>' : ''}<button class="dh-add" data-sh="choose" data-key="${dk}" aria-label="Ajouter le ${fmt(dk)}">+</button></span></div>${it.length ? `<ul class="items">${it.map(x => rowHTML(x, dk)).join('')}</ul>` : '<div class="empty">Rien de prévu</div>'}</div>`).join('')}</div>`;
  } else {
    const now = new Date(), m0 = new Date(now.getFullYear(), now.getMonth() + monthOff, 1), y = m0.getFullYear(), mo = m0.getMonth();
    const first = iso(m0), last = iso(new Date(y, mo + 1, 0));
    let n = 0, d = 0, body = '';
    for (let wk = mondayOf(first); wk <= last; wk = addDays(wk, 7)) {
      const from = wk < first ? first : wk, to = addDays(wk, 6) > last ? last : addDays(wk, 6);
      let rows = '';
      for (let dk = from; dk <= to; dk = addDays(dk, 1)) { const it = itemsOn(dk, { daily: false, from }).filter(x => matchF(x, pF)); if (!it.length) continue; n += it.length; d += it.filter(x => x.done).length;

    h = `<h2 id="sh-t">Un plan de lecture</h2>
      ${fld('l-mode', 'Plan', `<select id="l-mode">${opt('epitres', 'Les épîtres : Paul, Hébreux, Jacques, Pierre, Jean (120 chapitres)')}${opt('coller', 'Mon plan : une ligne par jour')}</select>`)}

      <div class="field" id="l-txt-f" hidden><label for="l-txt">Une ligne par jour, à partir de la date choisie</label><textarea id="l-txt" placeholder="Esther 1-2&#10;Esther 3-4&#10;Psaume 120"></textarea></div>
      <p class="soft small" id="l-prev"></p>`;
    ok = 'Créer le plan'; }
  if (mode === 'sadd' || mode === 'sedit') { const x = mode === 'sedit' ? S.sujets.find(z => z.id === key) : { t: '', theme: key || themeOfDay() || S.themes[0] }; if (!x) return;
    h = `<h2 id="sh-t">${mode === 'sadd' ? 'Nouveau sujet' : 'Mon sujet'}</h2>
      ${fld('s-t', 'Sujet', `<textarea id="s-t" style="min-height:80px">${esc(x.t)}</textarea>`)}
      ${fld('s-th', 'Thème', `<select id="s-th">${S.themes.map(t => opt(t, t, x.theme)).join('')}${S.themes.includes(x.theme) || !x.theme ? '' : opt(x.theme, x.theme + ' (ancien)', x.theme)}</select>`)}`;
    ok = mode === 'sadd' ? 'Ajouter' : 'Enregistrer'; if (mode === 'sedit') del = 'Supprimer ce sujet'; }
  if (mode === 'thadd' || mode === 'thedit') { const t = mode === 'thedit' ? key : '', kd = t ? (S.thKind[t] || 'perso') : 'perso', i = S.themes.indexOf(t);
    h = `<h2 id="sh-t">${t ? 'Mon thème' : 'Nouveau thème'}</h2>
      ${fld('t-n', 'Nom', `<input type="text" id="t-n" value="${esc(t)}">`)}
      ${fld('t-k', 'Groupe', `<select id="t-k">${opt('perso', 'Prière personnelle', kd)}${opt('inter', 'Intercession', kd)}</select>`)}
      ${t ? `<p class="soft small">${weekdaysOf(t).length ? 'Prié le ' + weekdaysOf(t).join(' et le ') + '.' : ''} Position ${i + 1} sur ${S.themes.length}.</p><div class="row">${i > 0 ? '<button class="btn sm line" data-thmove="-1">Monter</button>' : ''}${i < S.themes.length - 1 ? '<button class="btn sm line" data-thmove="1">Descendre</button>' : ''}</div>` : ''}`;
    ok = t ? 'Enregistrer' : 'Ajouter'; if (t) del = 'Supprimer ce thème'; }
  if (mode === 'eadd' || mode === 'eedit') { const e = mode === 'eedit' ? S.ens.find(x => x.id === key) : { t: '', url: '', theme: key || eSel || S.ensCur, date: '', week: '', note: '' }; if (!e) return;
    const q = e.date ? 'jour' : e.week ? 'semaine' : 'aucun';
    h = `<h2 id="sh-t">${mode === 'eadd' ? 'Un enseignement' : 'Modifier'}</h2>

    h = `<h2 id="sh-t">${t ? 'Mon thème' : 'Nouveau thème'}</h2>${fld('et-n', 'Nom', `<input type="text" id="et-n" value="${esc(t)}">`)}${t && S.ensAss[t] ? `<button class="btn sm line" data-eunass="1">Ce thème n'est plus assimilé</button>` : ''}`;
    ok = t ? 'Enregistrer' : 'Ajouter'; if (t) del = 'Supprimer ce thème'; }
  if (mode === 'tpadd' || mode === 'tpedit') { const p = mode === 'tpedit' ? S.tp.find(x => x.id === key) : { t: '', h: '' }; if (!p) return;
    h = `<h2 id="sh-t">${mode === 'tpadd' ? 'Un temps de prière' : 'Mon temps de prière'}</h2>${fld('tp-t', 'Nom', `<input type="text" id="tp-t" value="${esc(p.t)}" placeholder="Ex. Prière de midi">`)}${fld('tp-h', 'Heure (facultatif)', `<input type="time" id="tp-h" value="${toInput(p.h)}">`)}`;
    ok = mode === 'tpadd' ? 'Ajouter' : 'Enregistrer'; if (mode === 'tpedit' && S.tp.length > 1) del = 'Retirer'; }
  h += `<div class="msg" id="sh-msg" role="status"></div><div class="row"><button class="btn line" data-shno="1">Annuler</button><button class="btn" data-shok="1">${ok}</button></div>${del ? `<div><button class="btn sm danger" data-shdel="1">${del}</button></div>` : ''}`;

function show(h) { document.getElementById('sh-in').innerHTML = h; document.getElementById('sh').hidden = false; document.getElementById('sh-in').scrollTop = 0; }
function closeSheet() { document.getElementById('sh').hidden = true; shMode = null; armed = null; }
const $v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
/* Ce qui change dans la fenêtre selon les choix */
function sync(ev) {
  const id = ev && ev.target && ev.target.id;
  if (document.getElementById('p-type')) { const t = $v('p-type'); document.getElementById('p-end-f').hidden = !(t === 'jeune' || t === 'livre'); document.querySelector('#p-end-f label').textContent = t === 'livre' ? 'À finir pour le' : "Jusqu'au (période)"; }
  if (document.getElementById('s-type')) {
    if (id === 's-type') { const t = $v('s-type'); document.getElementById('s-titre').value = { jeune: 'Jeûne', veillee: 'Veillée', priere: 'Temps de prière' }[t];
      document.getElementById('s-pal').value = (PALIERS[t] || []).join('\n'); document.getElementById('s-time').value = t === 'veillee' ? '23:59' : '';
      if (t === 'jeune' || t === 'veillee') { const dw = String(t === 'jeune' ? 2 : 5); document.getElementById('s-dow').value = dw; } }
    const dates = serieDates(); document.getElementById('s-prev').textContent = dates.length ? dates.length + ' fois : du ' + fmtDay(dates[0]) + ' au ' + fmtDay(dates[dates.length - 1]) + '.' : 'Aucune date : vérifie le début et la fin.'; }
  if (document.getElementById('l-mode')) { const m = $v('l-mode');
    if (id === 'l-mode') document.getElementById('l-titre').value = m === 'epitres' ? 'Les épîtres' : 'Mon plan de lecture';
    document.getElementById('l-au-f').hidden = m !== 'epitres'; document.getElementById('l-txt-f').hidden = m !== 'coller';
    const days = lectureDays(); const max = days.reduce((a, d) => Math.max(a, d.n || 0), 0), min = days.reduce((a, d) => Math.min(a, d.n || 99), 99);
    document.getElementById('l-prev').textContent = days.length ? plural(days.length, 'jour') + (m === 'epitres' ? ' · ' + (min === max ? min : min + ' ou ' + max) + ' chapitres par jour · premier jour : ' + days[0].t : ' · du ' + fmt(days[0].date) + ' au ' + fmt(days[days.length - 1].date)) : (m === 'epitres' ? 'Vérifie les dates.' : 'Colle ton plan, une ligne par jour.'); }
  if (document.getElementById('e-q')) { const q = $v('e-q'); document.getElementById('e-d-f').hidden = q === 'aucun'; document.getElementById('e-d-l').textContent = q === 'semaine' ? 'La semaine du' : 'Le'; }
}
function serieDates() { const du = $v('s-du'), au = $v('s-au'), dow = +$v('s-dow'); if (!du || !au || au < du) return []; const out = []; for (let d = nextDow(du, dow); d <= au && out.length < 120; d = addDays(d, 7)) out.push(d); return out; }
function lectureDays() { const du = $v('l-du'); if (!du) return [];
  if ($v('l-mode') === 'epitres') { const au = $v('l-au'); if (!au || au < du) return []; return splitChapters(EPITRES, du, au); }
  return document.getElementById('l-txt').value.split(/\r?\n/).map(l => l.trim().replace(/^[-*•]\s*/, '')).filter(Boolean).slice(0, 400).map((t, i) => ({ date: addDays(du, i), t })); }
function sheetOk() {
  const msg = t => { document.getElementById('sh-msg').textContent = t; }, k = today();
  if (shMode === 'padd' || shMode === 'pedit') { const type = $v('p-type'), t = $v('p-title'), date = $v('p-date') || k, end = document.getElementById('p-end-f').hidden ? '' : $v('p-end'), time = fmtH($v('p-time')), note = $v('p-note');
    if (!t) return msg('Écris un titre ou un passage.'); if (end && end < date) return msg('La date de fin est avant le début.');
    if (shMode === 'padd') { S.plan.push({ id: uid(), type, t, date, end, time, note }); toast('Ajouté le ' + fmt(date)); }
    else Object.assign(S.plan.find(x => x.id === shKey), { type, t, date, end, time, note });
  }
  else if (shMode === 'serie') { const dates = serieDates(), titre = $v('s-titre') || 'Série', type = $v('s-type'), pal = document.getElementById('s-pal').value.split(/\r?\n/).map(x => x.trim()).filter(Boolean), time = fmtH($v('s-time'));
    if (!dates.length) return msg('Aucune date : vérifie le début et la fin.');
    const id = 'serie-' + uid(); S.series.push({ id, titre, type, dow: +$v('s-dow') });
    dates.forEach((d, i) => S.plan.push({ id: uid(), type, t: titre + (pal.length ? ' · ' + pal[Math.min(i, pal.length - 1)] : ''), date: d, end: '', time, note: '', planId: id }));
    toast(plural(dates.length, 'date') + ' ajoutées'); }
  else if (shMode === 'lecture') { const days = lectureDays(), titre = $v('l-titre') || 'Mon plan de lecture';
    if (!days.length) return msg($v('l-mode') === 'epitres' ? 'Vérifie les dates.' : 'Colle ton plan, une ligne par jour.');
    const id = 'lect-' + uid(); S.series.push({ id, titre, type: 'lecture' });
    days.forEach(d => S.plan.push({ id: uid(), type: 'lecture', t: d.t, date: d.date, end: '', time: '', note: '', planId: id }));
    toast(plural(days.length, 'jour') + ' de lecture ajoutés'); }
  else if (shMode === 'sadd' || shMode === 'sedit') { const t = $v('s-t'), theme = $v('s-th'); if (!t) return msg('Écris ton sujet.'); if (!theme) return msg('Crée d\'abord un thème.');
    if (shMode === 'sadd') { S.sujets.push({ id: uid(), t, theme, start: k }); toast('Sujet ajouté'); } else Object.assign(S.sujets.find(z => z.id === shKey), { t, theme }); }
  else if (shMode === 'thadd' || shMode === 'thedit') { const n = $v('t-n'), kd = $v('t-k'), old = shKey; if (!n) return msg('Donne un nom au thème.');
    if (n !== old && S.themes.includes(n)) return msg('Ce thème existe déjà.');
    if (shMode === 'thadd') S.themes.push(n);
    else if (n !== old) { S.themes[S.themes.indexOf(old)] = n; S.sujets.forEach(x => { if (x.theme === old) x.theme = n; }); delete S.thKind[old]; if (priPick === old) priPick = n; }
    S.thKind[n] = kd; }
  else if (shMode === 'eadd' || shMode === 'eedit') { const t = $v('e-t'), url = normUrl($v('e-u')), theme = $v('e-th'), q = $v('e-q'), d = $v('e-d'), note = $v('e-n');
    if (!t && !url) return msg('Écris un titre ou colle le lien.'); if (q !== 'aucun' && !d) return msg('Choisis la date.');
    const val = { t: t || 'Enseignement', url, theme, note, date: q === 'jour' ? d : '', week: q === 'semaine' ? mondayOf(d) : '' };
    if (shMode === 'eadd') { S.ens.push(Object.assign({ id: uid(), ecoute: null, medite: null, added: k }, val)); toast('Enseignement ajouté'); } else Object.assign(S.ens.find(x => x.id === shKey), val);
    eSel = theme; }
  else if (shMode === 'etadd' || shMode === 'etedit') { const n = $v('et-n'), old = shKey; if (!n) return msg('Donne un nom au thème.'); if (n !== old && S.ensThemes.includes(n)) return msg('Ce thème existe déjà.');
    if (shMode === 'etadd') S.ensThemes.push(n);
    else if (n !== old) { S.ensThemes[S.ensThemes.indexOf(old)] = n; S.ens.forEach(e => { if (e.theme === old) e.theme = n; }); if (S.ensAss[old]) { S.ensAss[n] = S.ensAss[old]; delete S.ensAss[old]; } if (S.ensCur === old) S.ensCur = n; if (eSel === old) eSel = n; } }
  else if (shMode === 'tpadd' || shMode === 'tpedit') { const t = $v('tp-t'), h = fmtH($v('tp-h')); if (!t) return msg('Donne un nom.');
    if (shMode === 'tpadd') S.tp.push({ id: 'tp-' + uid(), t, h }); else Object.assign(S.tp.find(x => x.id === shKey), { t, h }); }
  save(); closeSheet(); render();
}
function sheetDel(b) {
  if (!arm('sh' + shMode, b)) return;
  if (shMode === 'pedit') S.plan = S.plan.filter(x => x.id !== shKey);
  if (shMode === 'sedit') S.sujets = S.sujets.filter(x => x.id !== shKey);
  if (shMode === 'eedit') S.ens = S.ens.filter(x => x.id !== shKey);
  if (shMode === 'tpedit') S.tp = S.tp.filter(x => x.id !== shKey);
  if (shMode === 'thedit') { const n = openOf(shKey).length; if (n) { document.getElementById('sh-msg').textContent = 'Ce thème a encore ' + plural(n, 'sujet') + ' : change-les de thème d\'abord.'; return; } S.themes = S.themes.filter(t => t !== shKey); delete S.thKind[shKey]; }
  if (shMode === 'etedit') { const n = S.ens.filter(e => e.theme === shKey).length; if (n) { document.getElementById('sh-msg').textContent = 'Ce thème a encore ' + plural(n, 'enseignement') + ' : change-les de thème d\'abord.'; return; } S.ensThemes = S.ensThemes.filter(t => t !== shKey); delete S.ensAss[shKey]; if (S.ensCur === shKey) S.ensCur = S.ensThemes[0] || null; }
  save(); closeSheet(); render(); toast('Supprimé');
}

/* ---------- Navigation ---------- */
let view = 'jour';
const R = { jour: renderJour, plan: renderPlan, pri: renderPri, ens: renderEns, plus: renderPlus };
function render() { R[view](); document.getElementById('fab').hidden = !['plan', 'pri', 'ens'].includes(view); }
function go(v) { view = v; document.querySelectorAll('main > section').forEach(s => { s.hidden = s.id !== 'v-' + v; }); document.querySelectorAll('.nav button').forEach(t => t.setAttribute('aria-selected', t.dataset.v === v ? 'true' : 'false')); render(); window.scrollTo(0, 0); }

function toggle(kind, id, k) {
  if (kind === 'tp' || kind === 'suj') { const r = dayRec(k); r[id] = !r[id]; }
  if (kind === 'p') { const p = S.plan.find(x => x.id === id); if (!p) return; const dk = pDoneKey(p, k); p.done = p.done || {}; p.done[dk] = !p.done[dk]; if (!p.done[dk]) delete p.done[dk]; if (p.type === 'jeune' && p.done[dk]) dayRec(k).jeune = true; }
  if (kind === 'e') { const e = S.ens.find(x => x.id === id); if (!e) return; e.ecoute = e.ecoute ? null : today(); }
  save(); render();
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const ds = b.dataset, k = today();
  if (ds.v) return go(ds.v);
  if (b.id === 'fab') return openSheet(view === 'pri' ? 'sadd' : view === 'ens' ? 'eadd' : 'choose', view === 'pri' ? (priPick || themeOfDay() || S.themes[0]) : view === 'ens' ? eSel : null);
  if (ds.tg) { const [kind, id, dk] = ds.tg.split('|'); return toggle(kind, id, dk); }
  if (ds.ed) { const [kind, id] = ds.ed.split('|');
    if (kind === 'tp') return openSheet('tpedit', id); if (kind === 'suj') { priPick = null; priV = 'jour'; return go('pri'); }
    if (kind === 'p') return openSheet('pedit', id); if (kind === 'e') return openSheet('eedit', id); return; }
  if (ds.etg) { const [id, f] = ds.etg.split('|'), x = S.ens.find(z => z.id === id); if (!x) return; x[f] = x[f] ? null : k; if (f === 'medite' && x.medite && !x.ecoute) x.ecoute = k; save(); render(); return; }
  if (ds.sh) return openSheet(ds.sh, ds.key || null);
  if (ds.shno) return closeSheet();
  if (ds.shok) return sheetOk();
  if (ds.shdel) return sheetDel(b);
  if (ds.thmove) { const i = S.themes.indexOf(shKey), j = i + Number(ds.thmove); if (i < 0 || j < 0 || j >= S.themes.length) return; [S.themes[i], S.themes[j]] = [S.themes[j], S.themes[i]]; save(); render(); openSheet('thedit', shKey); return; }
  if (ds.eunass) { delete S.ensAss[shKey]; save(); closeSheet(); render(); return; }
  if (ds.pv) { pView = ds.pv; return render(); }
  if (ds.f) { pF = ds.f; return render(); }
  if (ds.wk) { weekOff += Number(ds.wk); return render(); }
  if (ds.mo) { monthOff += Number(ds.mo); return render(); }
  if (ds.sstop) { if (!arm('stop' + ds.sstop, b, 'Touche encore pour arrêter')) return;
    S.plan = S.plan.filter(p => !(p.planId === ds.sstop && p.date >= k && !(p.done && p.done[p.date])));
    if (!S.plan.some(p => p.planId === ds.sstop)) S.series = S.series.filter(s => s.id !== ds.sstop); save(); render(); toast('Série arrêtée'); return; }
  if (ds.priv) { priV = ds.priv; return render(); }
  if (ds.pick) { priPick = ds.pick === themeOfDay() ? null : ds.pick; return render(); }
  if (ds.sujall) { const r = dayRec(k); r.suj = !r.suj; save(); render(); if (r.suj) toast('Gloire à Dieu'); return; }
  if (ds.ans) { const x = S.sujets.find(s => s.id === ds.ans); if (x) { x.answered = k; save(); render(); toast('Gloire à Dieu'); } return; }
  if (ds.unans) { const x = S.sujets.find(s => s.id === ds.unans); if (x) { delete x.answered; save(); render(); } return; }
  if (ds.ndel) { if (!arm('n' + ds.ndel, b, false)) return; S.notes = S.notes.filter(s => s.id !== ds.ndel); save(); render(); return; }
  if (ds.es) { eSel = ds.es; return render(); }
  if (ds.ecur) { S.ensCur = ds.ecur; save(); render(); toast('Nouveau thème du moment'); return; }
  if (ds.eass) { if (!arm('ass', b, 'Touche encore : thème suivant')) return; S.ensAss[S.ensCur] = k; const nx = S.ensThemes.find(t => !S.ensAss[t]); if (nx) S.ensCur = nx; eSel = S.ensCur; save(); render(); toast(nx ? 'Thème suivant : ' + nx : 'Tous tes thèmes sont assimilés'); return; }
  if (b.id === 'pl-name-ok') { S.prenom = $v('pl-name'); save(); toast('Enregistré'); return; }
  if (b.id === 'b-bible-ok') { S.bibleUrl = $v('b-bible'); save(); toast(S.bibleUrl ? 'Adresse enregistrée' : 'Adresse par défaut'); return; }
  if (b.id === 'b-dl') { try { const blob = new Blob([backupText()], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'leve-toi-sauvegarde-' + k + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); markBackup(); toast('Sauvegarde téléchargée'); } catch (err) { toast('Utilise « Copier »'); } return; }
  if (b.id === 'b-copy') { const text = backupText(); const fb = () => { const ta = document.getElementById('b-paste'); ta.value = text; ta.focus(); ta.select(); toast('Sélectionné : copie-le à la main'); };
    try { navigator.clipboard.writeText(text).then(() => { markBackup(); toast('Copié : colle-le dans une note'); }, fb); } catch (err) { fb(); } return; }
  if (b.id === 'b-restore') { const f = document.getElementById('b-file').files[0], txt = document.getElementById('b-paste').value.trim();
    if (f) { const r = new FileReader(); r.onload = () => restoreFrom(r.result); r.readAsText(f); } else if (txt) restoreFrom(txt); else document.getElementById('b-msg').textContent = 'Choisis un fichier ou colle ta sauvegarde.'; return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('sh').hidden) closeSheet(); });
document.addEventListener('change', e => { if (e.target.closest && e.target.closest('#sh')) sync(e); });
document.addEventListener('input', e => { if (e.target.closest && e.target.closest('#sh') && /^(l-txt|s-pal)$/.test(e.target.id)) sync(e); });
document.getElementById('sh').addEventListener('click', e => { if (e.target.id === 'sh') closeSheet(); });
document.addEventListener('toggle', e => { const f = e.target.dataset && e.target.dataset.fold; if (f) folds[f] = e.target.open; }, true);
let lastDay = today();
document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); render(); } });
go('jour');
